name: Build and release

on:
  push:
    branches: [release-main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application
        run: |
          go test -race ./...
          go vet ./...
          npm test
          npm run check
          sh -n start.sh start.command
      - name: Select archive version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "value=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=v0.0.0-dev.${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build all platforms
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/build-release.py "$RELEASE_VERSION"
      - name: Smoke-test the Linux archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/smoke-release.py "build/releases/$RELEASE_VERSION/until-morning-$RELEASE_VERSION-linux-amd64.zip"
      - name: Smoke-test the direct Linux download
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/smoke-desktop.py "build/releases/$RELEASE_VERSION/until-morning-$RELEASE_VERSION-linux-amd64.run"
      - uses: actions/upload-artifact@v4
        with:
          name: until-morning-binaries
          path: build/releases/${{ steps.version.outputs.value }}/*
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: until-morning-binaries
          path: build/releases/${{ needs.build.outputs.version }}
      - name: Build universal macOS installer
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: python3 scripts/build-macos-package.py "$RELEASE_VERSION"
      - name: Smoke-test the packaged macOS application
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: python3 scripts/smoke-desktop.py "build/releases/$RELEASE_VERSION/until-morning-$RELEASE_VERSION-macos-universal.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: until-morning-macos
          path: build/releases/${{ needs.build.outputs.version }}/*.pkg
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: until-morning-binaries
          path: release-files
      - name: Smoke-test the direct Windows download
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: python scripts/smoke-desktop.py "release-files/until-morning-$env:RELEASE_VERSION-windows-amd64.exe"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: until-morning-*
          merge-multiple: true
          path: release-files
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          body = Path('docs/release-notes.md').read_text().replace('{{tag}}', os.environ['RELEASE_TAG'])
          Path('release-notes.md').write_text(body)
          PY
          mapfile -d '' assets < <(find release-files -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.run' -o -name '*.pkg' \) -print0)
          test "${#assets[@]}" -eq 11
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "Until Morning $RELEASE_TAG — первый пилотный релиз" --notes-file release-notes.md --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "Until Morning $RELEASE_TAG — первый пилотный релиз" --notes-file release-notes.md
          fi
          # GitHub displays a SHA-256 digest for each uploaded asset.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > asset-names.txt
          if grep -Fxq SHA256SUMS.txt asset-names.txt; then
            gh release delete-asset "$RELEASE_TAG" SHA256SUMS.txt --yes
          fi
